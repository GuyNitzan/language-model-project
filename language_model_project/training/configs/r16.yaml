# QLoRA hyperparameters for one arm of the required rank sweep (r in {8, 16, 32}).
# Consumed by notebooks/03_finetune.ipynb's LORA_RANKS loop — kept here as an
# explicit, inspectable record of what each run actually used, for the report.
base_model: Qwen/Qwen2.5-3B-Instruct
lora:
  r: 16
  alpha: 32          # 2r, per the plan
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none
  task_type: CAUSAL_LM
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16   # T4 is Turing: no bf16
  bnb_4bit_use_double_quant: true
training:
  max_seq_len: 2048    # see prepare_dataset.py's docstring for why this isn't 1024
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1   # default (8) OOMs a T4 at max_seq_len=2048 during loss upcast
  prediction_loss_only: true      # only eval_loss is read; don't retain eval logits
  gradient_accumulation_steps: 8
  num_train_epochs: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  fp16: true
  gradient_checkpointing: true
